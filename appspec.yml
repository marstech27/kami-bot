version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/kami-bot
    overwrite: true
file_exists_behavior: OVERWRITE
permissions:
  - object: /home/ubuntu/kami-bot
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - directory
hooks:
  BeforeInstall:
    - location: deploy/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: deploy/after_install.sh
      timeout: 600
      runas: ubuntu
  ApplicationStart:
    - location: deploy/start.sh
      timeout: 120
      runas: ubuntu
  ApplicationStop:
    - location: deploy/stop.sh
      timeout: 60
      runas: ubuntu
